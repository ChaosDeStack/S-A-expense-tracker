<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>Expense Tracker</h1>

        <!--Loading / error messages-->
        <p id="status" role="status"></p>

        <!--Home currency selector-->
        <section>
            <label for="home-currency">Home Currency</label>
            <select id="home-currency">
                <option value="KES" selected>KES</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
            </select>
        </section>

        <!--Add expense form-->
        <section>
            <h2>Add Expense</h2>
            <form id="expense-form">
                <input type="text" id="description" placeholder="Description" required/>
                <input type="number" id="amount" placeholder="Amount" min="0" step="0.01" required/>

                <select id="currency" required>
                    <option value="KES" selected>KES</option>
                    <option value="USD">USD</option>
                    <option value="EUR">EUR</option>
                    <option value="GBP">GBP</option>
                </select>

                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Transport">Transport</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Utilities">Utilities</option>
                </select>
                <button type="submit">Add Expense</button>
            </form>
        </section>  
        
        <!--filter list-->
        <section>
            <h2>Filter Expenses</h2>
            <label for="filter-category">Category:</label>
            <select id="filter-category">
                <option value="">All</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Utilities">Utilities</option>
            </select>

            <label for="filter-currency">Currency:</label>
            <select id="filter-currency">
                <option value="">All</option>
                <option value="KES">KES</option>
                <option value="USD">USD</option>
                <option value="EUR">EUR</option>
                <option value="GBP">GBP</option>
            </select>

            <ul id="expense-list"></ul>

            <button id="filter-button">Filter</button>
        </section>

        <!--Total-->
        <section>
            <h2>Total<span id="total-amount">: 0.00</span> <span id="total-currency">KES</span></h2>
        </section>
    </main>

    <script type="module" src="src/main.js"></script>
</body>
</html>
